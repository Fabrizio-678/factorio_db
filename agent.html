<!DOCTYPE html>
<html lang="en" >
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Factorio DB</title>
        <link rel="icon" type="image/png" href="logo/logo.png">
        <link rel="stylesheet" href="styles.css" type="text/css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body class="d-flex justify-content-center px-0 flex-column w-100 min-vh-100">
        <header class="w-100 bg-2 ps-4 p-2">
            <nav class="navbar md:navbar-expand bg-2 fg-2">
                <div class="container-fluid">
                    <div class="navbar-brand" href="#">
                        <img class="float-start" src="logo/logo.png" alt="Logo de la web" width="38" height="38">
                    </div>
                    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon" aria-hidden="true"></span>
                    </button>
                    <dialog class="drawer drawer-end" tabindex="-1">
                        <div class="drawer-header">
                            <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                        </div>
                        <div class="drawer-body mb-2 md:mb-0">
                            <ul class="nav navbar-nav nav-pills me-auto">
                                <li class="nav-item">
                                    <a class="nav-link" href="index.html">Home</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="posts.html">Posts</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link active" aria-current="page" href="#">EngiAI</a>
                                </li>
                            </ul>
                        </div>
                    </dialog>
                </div>
            </nav>
        </header>
        <main class="bg-body d-flex w-100 p-4 flex-grow-1">
            <button class="btn-solid mb-auto" type="button" data-bs-toggle="drawer" data-bs-target="#drawerAI" aria-label="Open EngiAI Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-bar-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M4.146 3.646a.5.5 0 0 0 0 .708L7.793 8l-3.647 3.646a.5.5 0 0 0 .708.708l4-4a.5.5 0 0 0 0-.708l-4-4a.5.5 0 0 0-.708 0M11.5 1a.5.5 0 0 1 .5.5v13a.5.5 0 0 1-1 0v-13a.5.5 0 0 1 .5-.5"/>
                </svg>
            </button>
            <dialog class="drawer drawer-start w-auto" tabindex="-1" data-bs-scroll="true" data-bs-backdrop="false" id="drawerAI" aria-labelledby="drawerScrollingLabel">
                <div class="drawer-header bg-1">
                    <h5 class="drawer-title flex-grow-1">EngiAI</h5>
                    <button type="button" class="btn-solid btn-sm" data-bs-dismiss="drawer" aria-label="Close EngiAI Menu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-bar-left" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M11.854 3.646a.5.5 0 0 1 0 .708L8.207 8l3.647 3.646a.5.5 0 0 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 0 1 .708 0M4.5 1a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 1 0v-13a.5.5 0 0 0-.5-.5"/>
                        </svg>
                    </button>
                </div>
                <div class="drawer-body">
                    <div class="nav nav-pills navbar-nav">
                        <a class="nav-link active" aria-current="page" href="#">Normal Conversation</a>
                        <a class="nav-link" href="#">Yes or No Questions</a>
                        <a class="nav-link" href="#">Multiple Choice</a>
                    </div>
                </div>
            </dialog>
            <div class="bd-content prose lg:ps-2 lg:pt-4 w-100 d-flex flex-column">
                <!--<p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sequi laboriosam optio ab minus impedit cum hic, illum dolorem, eius nesciunt perferendis doloremque dolores commodi velit aspernatur nobis laborum rerum fugiat!</p>-->
                <div id="bot-chat" class="w-100 d-flex flex-column"></div>
                <div class="sm:sticky-bottom bg-body mt-auto">
                    <div class="input-group mb-6">
                        <input id="user-input" type="text" class="form-control" placeholder="Write something beautiful..." aria-describedby="button-send">
                        <button class="btn-outline theme-secondary input-group-btn" type="button" id="button-send">Enviar</button>
                    </div>
                </div>
            </div>
        </main>
        <footer>

        </footer>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="script_engiai.js"></script>
    </body>
</html>
